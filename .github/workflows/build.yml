name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest
    # Without this the job inherits GitHub's 360 minute default, so a single hung test
    # would burn six hours of runner time before anyone was told the build had failed.
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    # Seconds of real work; anything longer is a hung fetch, not a slow lint.
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Setup Helm
      uses: azure/setup-helm@v5
      with:
        # Pinned to match the version deploy.ps1 is exercised with; it passes --force-conflicts,
        # which only exists in Helm 4.
        version: v4.1.0
    # `helm dependency build` (unlike `update`) refuses to fetch from a repository URL that is not
    # already registered, so a bare runner needs this first.
    - name: Add chart repos
      run: helm repo add spotahome https://spotahome.github.io/redis-operator
    # Fetches redis-operator into charts/ (it is gitignored) and verifies Chart.lock is in sync
    # with Chart.yaml -- the same check deploy.ps1 performs before every release.
    - name: Resolve chart dependencies
      working-directory: redmist-deploy
      run: helm dependency build .
    - name: Lint
      working-directory: redmist-deploy
      run: |
        for env in prod test dev; do
          echo "::group::helm lint ($env)"
          helm lint . -f values.yaml -f "values-$env.yaml"
          echo "::endgroup::"
        done
    - name: Render
      working-directory: redmist-deploy
      run: |
        for env in prod test dev; do
          echo "::group::helm template ($env)"
          helm template "redmist-$env" . -f values.yaml -f "values-$env.yaml" > /dev/null
          echo "::endgroup::"
        done
    # The nightly compose job is disabled in every environment, so the renders above never reach its
    # templates -- a break in them would ship unnoticed and only appear whenever somebody first turns
    # it on. Rendered here with it enabled so that path is covered too. Prod and test must render;
    # dev must NOT, because it declares no secretName and cannot run this job.
    - name: Render social-compose
      working-directory: redmist-deploy
      run: |
        for env in prod test; do
          echo "::group::helm template ($env, social-compose enabled)"
          helm template "redmist-$env" . -f values.yaml -f "values-$env.yaml"             --set redmist-social-compose.enabled=true > /dev/null
          echo "::endgroup::"
        done
        echo "::group::helm template (dev, social-compose enabled) -- expected to fail"
        if helm template redmist-dev . -f values.yaml -f values-dev.yaml              --set redmist-social-compose.enabled=true > /dev/null 2>&1; then
          echo "dev rendered the compose job, but it declares no secretName; the guard is gone."
          exit 1
        fi
        echo "refused, as intended"
        echo "::endgroup::"