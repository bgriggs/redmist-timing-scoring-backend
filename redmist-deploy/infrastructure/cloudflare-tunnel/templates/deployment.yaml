apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: {{ .Values.namespace }}
  labels:
    app: cloudflared
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: cloudflared
  # Bring a new replica up and connected before an old one is removed, so the tunnel keeps serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Let a new connector finish registering its edge connections before the next old one goes
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: cloudflared
      # cloudflared reads its config only at startup, so roll the pods when the config changes
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:{{ .Chart.AppVersion }}
        args:
          - tunnel
          - --config
          - /etc/cloudflared/config.yaml
          - --metrics
          - 0.0.0.0:2000
          - run
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
        # /ready returns 200 only once the connector is registered with Cloudflare
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          periodSeconds: 5
        ports:
          - containerPort: 2000
            name: metrics
            protocol: TCP
        volumeMounts:
          - name: config
            mountPath: /etc/cloudflared
            readOnly: true
          - name: credentials
            mountPath: /etc/cloudflared/credentials
            readOnly: true
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory }}
            cpu: {{ .Values.resources.requests.cpu }}
          limits:
            memory: {{ .Values.resources.limits.memory }}
            cpu: {{ .Values.resources.limits.cpu }}
      volumes:
        - name: credentials
          secret:
            secretName: cloudflared-credentials
        - name: config
          configMap:
            name: cloudflared-config
            items:
              - key: config.yaml
                path: config.yaml
