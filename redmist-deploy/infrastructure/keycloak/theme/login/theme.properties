# RedMist login theme.
#
# Inherits keycloak.v2 -- the built-in PatternFly v5 theme that is Keycloak 26's
# default -- so every page and every future page keeps working without a template
# override here. This theme carries colors and type only; there are no .ftl files.
#
# styles is NOT additive over the parent: naming it here replaces the parent's
# list, so css/styles.css (which resolves up to keycloak.v2) has to be repeated
# ahead of ours or the PatternFly layer is dropped entirely.
# resources/img/favicon.ico overrides the one keycloak.v2's template.ftl points at
# via ${url.resourcesPath}, so the browser tab matches the app without this theme
# having to carry a template override. It is a copy of public/favicon.ico in
# redmist-landing-ui -- replace both together.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/redmist.css

# Lets the parent stamp pf-v5-theme-dark from prefers-color-scheme. redmist.css
# keys off the same media query, so the login page follows the OS the way the
# app's own light/dark toggle does.
darkMode=true
