namespace: keycloak

keycloak:
  replicas: 1  # Start with 1 for migration, scale to 2 after
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.7.1"
  
  hostname: auth.redmist.racing
  
  # Below Keycloak's documented 750Mi floor once the JVM sizes its heap from the
  # limit, but every node in the pool is already 70-97% committed on memory
  # requests, so a larger request would leave this pod Pending with nowhere to go.
  # Raise these once the node pool has headroom.
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

database:
  host: ""  # Will be set via helm install
  port: 25060
  name: keycloak-prod
  username: doadmin
  sslMode: require

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
