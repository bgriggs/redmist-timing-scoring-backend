# Development Environment Configuration
global:
  env:
    "ASPNETCORE_ENVIRONMENT": "Production"
    "ASPNETCORE_FORWARDEDHEADERS_ENABLED": "true"
    "ASPNETCORE_URLS": "http://+:8080"
    "REDIS_SVC": "redis-master:6379"
    "Keycloak__Realm": "redmist"
    "Keycloak__AuthServerUrl": "https://auth.redmist.racing"
    "SentinelApiUrl": "https://svs-api.sentinel.racing/api/"
    "Server__ExtTelemUrl": "https://api-dev.redmist.racing/status/v1/ExternalTelemetry"

  secrets:
    - env: "REDIS_PW"
      name: "rmkeys-dev"
      key: "redis"
    - env: "ConnectionStrings__Default"
      name: "rmkeys-dev"
      key: "db"
    - env: "Keycloak__ClientSecret"
      name: "rmkeys-dev"
      key: "usermansecret"

# Override for all subcharts
redmist-status-api:
  environment: dev

redmist-user-management:
  environment: dev

redmist-event-management:
  environment: dev

redmist-relay-api:
  environment: dev

# redmist-social-compose is deliberately absent here. Dev cannot run it: global.secrets is a list,
# so the three entries above REPLACE the nine in values.yaml, and the job needs Assets:ApiAccessKey
# and Assets:StorageAccessKey to store the pictures it takes. Adding those two to dev is not enough
# either -- global.env is a map and deep-merges, so dev inherits production's Assets__StorageZoneName
# and would upload into the production zone. Enabling it here now fails while rendering, on the
# required secretName, which is the loudest of the available failures.

# Redis configuration for development
redis:
  fullnameOverride: "redis-dev"
  auth:
    existingSecret: rmkeys-dev
