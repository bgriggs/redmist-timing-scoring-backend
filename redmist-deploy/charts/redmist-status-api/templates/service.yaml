apiVersion: v1
kind: Service
metadata:
  name: {{ include "redmist-status-api.fullname" . }}
  labels:
    {{- include "redmist-status-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # Session affinity by client IP, for traffic that goes through this Service. Public traffic
  # does not: ingress-nginx sends requests straight to the pod endpoints, so what keeps a hub
  # client's negotiate and WebSocket upgrade on one pod is the ingress's upstream-hash-by in
  # values.yaml, not this.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "redmist-status-api.selectorLabels" . | nindent 4 }}
