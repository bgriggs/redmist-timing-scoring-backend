replicaCount: 1

image:
  repository: bigmission/redmist-status-api
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # WebSocket support for SignalR
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Consistent hash routing, so a client's negotiate and its WebSocket upgrade reach the same
    # pod. SignalR keeps the connection a negotiate creates on the pod that answered it, and an
    # upgrade that lands on another pod is answered 404 ("No Connection with that ID"). The app's
    # client retries after a delay and gets there eventually, so it shows as a slow hub connect and
    # an error logged for each failed attempt - as a 502 in the app's logs, not the 404 nginx sent.
    #
    # Keyed on CF-Connecting-IP: the client address Cloudflare's edge sets and overwrites, and the
    # one StatusApi's rate limiter reads first. Not $remote_addr. Public traffic reaches nginx
    # through the cloudflared tunnel, so that address is whichever tunnel replica carried the
    # request, and one client's negotiate and upgrade can take different replicas. With it in the
    # key, about one hub upgrade in six came back 404 over an hour of a live weekend.
    #
    # The cost of keying on the client address is that viewers sharing one - a track's Wi-Fi - all
    # land on the same pod, where they share that pod's in-memory rate limits rather than, by
    # chance, two pods'. And a phone that negotiates over IPv4 and upgrades over IPv6 presents two
    # addresses, so it can still miss and still relies on retrying.
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_cf_connecting_ip"
  # Environment-specific configuration
  environment: prod  # Override this in environment-specific values files
  domain: redmist.racing
  subdomain: api
  hosts:
  - paths: 
    - path: /status/(.*)
      pathType: ImplementationSpecific
  tls: false

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  # Classic HPA (used when keda.enabled is false)
  targetCPUUtilizationPercentage: 90
  targetMemoryUtilizationPercentage: 80
  # KEDA ScaledObject (recommended — enables event-driven scaling)
  keda:
    enabled: false
    # Address of the Prometheus server in the cluster
    prometheusServerAddress: http://prometheus-server.monitoring:9090
    # Seconds to wait before scaling down after last event ends (default 5 minutes)
    cooldownPeriod: 300
    # Minimum pods to run while any live event is active. The live_events trigger
    # is clamped to 1 regardless of event count, then multiplied by this value,
    # so KEDA always targets exactly this many pods during an event.
    podsWhenLive: 2
    # Scale out one additional pod per N SignalR connections beyond podsWhenLive * N.
    # e.g. podsWhenLive=2, targetConnectionsPerPod=50 → 3rd pod added at 101 connections.
    # Leave empty to disable connection-based scale-out.
    targetConnectionsPerPod: 50

# Export downloads stage a file on disk before streaming it, so this pod writes to its
# ephemeral storage in a way it never used to. The service caps itself at 512Mi of staged
# exports and refuses further requests with a 503, which is the control that should
# actually bind - these limits sit above that cap deliberately, as a backstop for a bug in
# that accounting rather than a routine ceiling. Keep them above it: if they ever invert,
# the pod is evicted, taking its SignalR connections with it, instead of cleanly refusing
# one download. The remaining headroom covers logs and ordinary container writes.
resources:
  requests:
    cpu: "75m"
    memory: "240Mi"
    ephemeral-storage: "512Mi"
  limits:
    cpu: "300m"
    memory: "380Mi"
    ephemeral-storage: "1536Mi"

serviceAccount:
  create: false

serviceMonitor:
  # Enable a Prometheus ServiceMonitor so Prometheus scrapes the /metrics endpoint.
  # Requires the Prometheus Operator (kube-prometheus-stack) to be installed.
  enabled: false
  interval: "15s"

env:
  PathBase: "/status"
