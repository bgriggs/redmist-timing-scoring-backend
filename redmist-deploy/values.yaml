global:
  env:
    "ASPNETCORE_ENVIRONMENT": "Production"
    "ASPNETCORE_FORWARDEDHEADERS_ENABLED": "true"
    "ASPNETCORE_URLS": "http://+:8080"
    "REDIS_SVC": "redis-master:6379"
    "Keycloak__Realm": "redmist"
    "Keycloak__AuthServerUrl": "https://auth.redmist.racing"
    "SentinelApiUrl": "https://svs-api.sentinel.racing/api/"
    "Server__ExtTelemUrl": "https://api.redmist.racing/status/v1/ExternalTelemetry"
    "Assets__StorageZoneName": "redmist-assets"
    "Assets__MainReplicationRegion": "de"
    "Assets__CdnId": "5008374"
    "Archive__StorageZoneName": "redmist-archive"
    "Archive__MainReplicationRegion": "ny"
    "Archive__CdnId": "5058723"
    "Email__Host": "in-v3.mailjet.com"
    "Email__Port": "587"

  secrets:
    - env: "REDIS_PW"
      name: "rmkeys"
      key: "redis"
    - env: "ConnectionStrings__Default"
      name: "rmkeys"
      key: "db"
    - env: "Keycloak__ClientSecret"
      name: "rmkeys"
      key: "usermansecret"
    - env: "Assets__ApiAccessKey"
      name: "rmkeys"
      key: "assetsapiaccesskey"
    - env: "Assets__StorageAccessKey"
      name: "rmkeys"
      key: "assetsstorageaccesskey"
    - env: "Archive__ApiAccessKey"
      name: "rmkeys"
      key: "archiveapiaccesskey"
    - env: "Archive__StorageAccessKey"
      name: "rmkeys"
      key: "archivestorageaccesskey"
    - env: "Email__Username"
      name: "rmkeys"
      key: "emailusername"
    - env: "Email__Password"
      name: "rmkeys"
      key: "emailpassword"

# Social post composition.
#
# Off by default, and deliberately so. Turning it on starts a nightly job that calls a paid API and
# writes drafts, and two things have to be true first:
#   1. The rmkeys secret needs a claudeapikey entry. Without it the pod cannot start, and because a
#      CronJob creates no pod until its schedule fires, `helm upgrade --wait` will not catch that --
#      the first failure would appear at 5 AM.
#   2. There is somewhere to review what it drafts. Nothing here can publish, so until the admin UI
#      exists the drafts would sit in SocialPosts unread.
# Enable with --set redmist-social-compose.enabled=true, or by flipping this once both hold.
#
# The condition key has to live here rather than in the subchart's own values.yaml: see the note in
# Chart.yaml about coalesced values.
redmist-social-compose:
  enabled: false

# Redis Operator configuration
redis-operator:
  enabled: true

# Redis instance configuration (using Redis Operator)
redis:
  name: "redis"
  # Number of Redis replicas (master + replica)
  replicas: 2
  
  # Sentinel configuration for high availability
  sentinel:
    replicas: 3
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
  
  # Redis resources
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  
  # Authentication - uses existing secret
  auth:
    secretName: "rmkeys"
    secretKey: "redis"
  
  # Custom Redis configuration
  customConfig:
    - "maxmemory-policy allkeys-lru"
    - "appendonly no"